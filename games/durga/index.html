    <script>
      // Kiosk screens are often short and wide: scale the whole game down a little so
      // the Left / Right / Trishul buttons stay on screen without scrolling.
      (function () {
        var root = document.documentElement;
        function fit() {
          var z = Math.min(1, Math.max(0.55, window.innerHeight / 900));
          root.style.zoom = z === 1 ? '' : String(z);
        }
        fit();
        window.addEventListener('resize', fit);
      })();
